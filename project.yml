name: Soundscape
options:
  bundleIdPrefix: com.flaviocopes
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Soundscape:
    type: application
    platform: macOS
    sources: [Soundscape]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviocopes.soundscape
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soundscape
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  SoundscapeTV:
    type: application
    platform: tvOS
    sources:
      - SoundscapeTV
      - Soundscape/Sound.swift
      - Soundscape/Unzip.swift
      - Soundscape/Channel.swift
      - Soundscape/Mixer.swift
    info:
      path: SoundscapeTV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviocopes.soundscape.tv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soundscape
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DGFKNTAG99
  SoundscapeiOS:
    type: application
    platform: iOS
    sources:
      - SoundscapeiOS
      - Soundscape/Sound.swift
      - Soundscape/Unzip.swift
      - Soundscape/Channel.swift
      - Soundscape/Mixer.swift
      - Soundscape/MixerView.swift
      - Soundscape/AppIcon.icon
    info:
      path: SoundscapeiOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviocopes.soundscape.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soundscape
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DGFKNTAG99
